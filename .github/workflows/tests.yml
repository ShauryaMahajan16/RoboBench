name: RoboBench Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check inputs and endpoints
        run: python test_planner.py

      - name: Check designed scenarios
        run: python scenarios.py

      - name: Check generated maps
        run: python test_maps.py

      - name: Check BFS comparisons
        run: python test_bfs.py

      - name: Check search effort
        run: python exploration.py

      - name: Check fixed-map benchmark
        run: python benchmark.py

      - name: Check offset passages
        run: python offset_passages.py

      - name: Check coarse-to-fine planning
        run: python test_adaptive.py